<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mycookies demo</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --ink: #172033;
        --muted: #5c6678;
        --line: #d8dee9;
        --accent: #176b87;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: grid;
        gap: 10px;
        padding: 44px clamp(18px, 5vw, 64px) 22px;
        border-bottom: 1px solid var(--line);
        background: #fff;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
        gap: 18px;
        padding: 22px clamp(18px, 5vw, 64px) 140px;
      }

      section,
      aside {
        display: grid;
        gap: 14px;
        align-content: start;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: clamp(30px, 5vw, 56px);
        line-height: 1.05;
      }

      h2 {
        font-size: 18px;
      }

      .eyebrow {
        color: var(--accent);
        font-weight: 850;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .metric {
        display: grid;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .metric strong {
        font-size: 22px;
      }

      small {
        color: var(--muted);
      }

      code {
        border-radius: 4px;
        padding: 2px 5px;
        background: #edf2f7;
      }

      @media (max-width: 820px) {
        main,
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">mycookies demo</p>
      <h1>隐私 banner 测试页</h1>
      <p>用于公开 README 截图、键盘可达性检查和 GPC/DNT 行为验证。</p>
    </header>
    <main>
      <section>
        <h2>页面内容</h2>
        <p>这个页面模拟一个真实站点首屏。banner 会从同一目录读取 <code>privacy-plugins.json</code> 和样式文件。</p>
        <div class="grid">
          <div class="metric">
            <strong>Required</strong>
            <small>必要项目单独披露</small>
          </div>
          <div class="metric">
            <strong>Optional</strong>
            <small>非必要插件先选择后加载</small>
          </div>
          <div class="metric">
            <strong>GPC</strong>
            <small>浏览器退出信号保持可选项关闭</small>
          </div>
        </div>
      </section>
      <aside>
        <h2>验证点</h2>
        <p>首屏不自动蓝框聚焦按钮。</p>
        <p>“仅最小必要”保存后刷新不再重复显示。</p>
        <p>偏好中心中必要项目为已勾选且不可关闭。</p>
      </aside>
    </main>
    <script src="/privacy-plugin-loader.js?v=20260524v1" defer></script>
  </body>
</html>
