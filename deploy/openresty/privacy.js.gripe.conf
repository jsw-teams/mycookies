server {
    listen 80;
    server_name privacy.js.gripe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 2053 ssl;
    listen 2083 ssl;
    listen 2087 ssl;
    listen 2096 ssl;
    listen 8443 ssl;
    http2 on;
    server_name privacy.js.gripe;

    ssl_certificate     /etc/openresty/ssl/js.gripe.fullchain.pem;
    ssl_certificate_key /etc/openresty/ssl/js.gripe.key.pem;

    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    charset utf-8;
    charset_types text/plain text/markdown text/css application/xml application/json application/javascript;
    server_tokens off;

    root /opt/privacy-js-gripe/public;
    index index.html;

    include /usr/local/openresty/nginx/conf/cloudflare-only.inc;
    include /usr/local/openresty/nginx/conf/error_pages_server.inc;
    include /usr/local/openresty/nginx/conf/sensitive-deny.inc;

    access_log logs/privacy.js.gripe.access.log main;
    error_log  logs/privacy.js.gripe.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=(), join-ad-interest-group=(), run-ad-auction=()" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
    }

    location = /demo.html {
        try_files /demo.html =404;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
    }

    location = /privacy-plugins.json {
        types { application/json json; }
        default_type application/json;
        try_files /privacy-plugins.json =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=300, s-maxage=300" always;
    }

    location ~* ^/(?:privacy-plugin-loader|builder)\.js$ {
        types { application/javascript js; }
        default_type application/javascript;
        try_files $uri =404;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=86400, s-maxage=86400" always;
    }

    location ~* ^/(?:privacy-plugin-banner|builder)\.css$ {
        types { text/css css; }
        default_type text/css;
        try_files $uri =404;
        access_log off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "public, max-age=86400, s-maxage=86400" always;
    }

    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* ^/(?:\.git|\.next|_next|_nuxt|\.astro|\.vite|dist/\.vite)(?:/|$) {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
